<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos de Viaje</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --text: #e8e9ed;
    --muted: #8b8f9c;
    --accent: #6c5ce7;
    --green: #2ecc71;
    --red: #ff6b6b;
    --border: #2a2e3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .value.green { color: var(--green); }
  .value.red { color: var(--red); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .section h2 { font-size: 16px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .cat-tag { background: rgba(108,92,231,0.15); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .del-btn:hover { color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; }
  canvas { max-height: 260px; }
</style>
</head>
<body>
<div class="container">
  <h1>✈️ Gastos de Viaje</h1>
  <p class="subtitle">Actualizado en vivo desde tu bot de Telegram</p>

  <div class="cards" id="summaryCards"></div>

  <div class="section">
    <h2>Gasto por categoría</h2>
    <canvas id="categoryChart"></canvas>
  </div>

  <div class="section">
    <h2>Movimientos recientes</h2>
    <table id="movementsTable">
      <thead>
        <tr><th>Fecha</th><th>Desc.</th><th>Categoría</th><th>Monto</th><th>USD</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">Todavía no hay movimientos. Mandale un mensaje a tu bot de Telegram para empezar.</div>
  </div>
</div>

<script>
let chart;

async function loadData() {
  const [movements, summary] = await Promise.all([
    fetch('/api/movements').then(r => r.json()),
    fetch('/api/summary').then(r => r.json())
  ]);
  renderSummary(summary);
  renderChart(summary.byCategory);
  renderTable(movements);
}

function renderSummary(summary) {
  const gasto = summary.totals.find(t => t.type === 'gasto');
  const ingreso = summary.totals.find(t => t.type === 'ingreso');
  const gastoUsd = gasto?.total_usd || 0;
  const ingresoUsd = ingreso?.total_usd || 0;
  const balance = ingresoUsd - gastoUsd;

  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="label">Gastado</div><div class="value red">US$${gastoUsd.toFixed(2)}</div></div>
    <div class="card"><div class="label">Ingresos</div><div class="value green">US$${ingresoUsd.toFixed(2)}</div></div>
    <div class="card"><div class="label">Balance</div><div class="value ${balance >= 0 ? 'green' : 'red'}">US$${balance.toFixed(2)}</div></div>
  `;
}

function renderChart(byCategory) {
  const ctx = document.getElementById('categoryChart');
  if (chart) chart.destroy();
  if (!byCategory.length) {
    ctx.style.display = 'none';
    return;
  }
  ctx.style.display = 'block';
  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: byCategory.map(c => c.category),
      datasets: [{
        data: byCategory.map(c => c.total_usd),
        backgroundColor: ['#6c5ce7', '#00cec9', '#fdcb6e', '#ff7675', '#74b9ff', '#a29bfe', '#55efc4'],
        borderWidth: 0
      }]
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { color: '#e8e9ed', boxWidth: 12, font: { size: 12 } } } }
    }
  });
}

function renderTable(movements) {
  const tbody = document.querySelector('#movementsTable tbody');
  const empty = document.getElementById('emptyState');
  if (!movements.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = movements.map(m => `
    <tr>
      <td>${new Date(m.created_at).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })}</td>
      <td>${m.description}</td>
      <td><span class="cat-tag">${m.category}</span></td>
      <td style="color:${m.type === 'ingreso' ? 'var(--green)' : 'var(--text)'}">${m.currency_local} ${m.amount_local}</td>
      <td>US$${m.amount_usd.toFixed(2)}</td>
      <td><button class="del-btn" onclick="removeMovement(${m.id})">✕</button></td>
    </tr>
  `).join('');
}

async function removeMovement(id) {
  await fetch('/api/movements/' + id, { method: 'DELETE' });
  loadData();
}

loadData();
setInterval(loadData, 15000); // refresca solo cada 15s
</script>
</body>
</html>
